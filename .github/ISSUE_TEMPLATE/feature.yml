name: Feature request
description: Propose a user-facing capability or meaningful behavior change
title: "feat: "
labels:
  - type:feature
  - priority:p2
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or product problem are we solving?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable result, not an implementation guess.
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints and invariants
      description: Truth-first, security, authorization, compatibility, cost, or other constraints.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing workflow, deterministic solution, or simpler implementation if relevant.

  - type: checkboxes
    id: truth
    attributes:
      label: CVortex principles
      options:
        - label: This proposal does not require inventing or auto-confirming user career facts.
          required: true
        - label: Human approval remains explicit for employer-facing actions.
          required: true
