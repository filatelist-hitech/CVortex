name: Quality

on:
  pull_request:
  push:
    branches: [stage]

permissions:
  contents: read

jobs:
  m0-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: QA evidence integrity and helper regressions
        run: |
          python3 scripts/qa_evidence.py
          python3 -m unittest discover -s scripts -p 'test_qa_evidence.py'
          python3 -m unittest discover -s scripts -p 'test_career_review_harness.py'
          python3 -m unittest discover -s scripts -p 'test_vacancy_migration_harness.py'
      - name: B01 canonical integrity and regressions
        run: |
          node docs/07-Design/reference/build-reference.cjs --check
          node --test docs/07-Design/reference/build-reference.test.cjs
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Build and install locked dependencies
        run: make init
      - name: Backend and frontend checks
        run: make lint
      - name: Start backend dependencies for tests
        run: docker compose up --detach --wait postgres redis
      - name: Backend and frontend tests
        run: make test
      - name: Frontend production build
        run: docker compose build frontend

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [m0-quality]
    steps:
      - uses: actions/checkout@v5
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Build and install locked dependencies
        run: make init
      - name: Start stack for E2E
        run: docker compose up --detach --wait postgres redis backend frontend nginx
      - name: Install Playwright browsers with deps
        run: |
          cd apps/frontend
          npx playwright install --with-deps chromium
      - name: Run Playwright E2E smoke and critical tests
        run: |
          cd apps/frontend
          PLAYWRIGHT_BASE_URL="http://127.0.0.1:8080" npm run test:e2e:critical
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 7
