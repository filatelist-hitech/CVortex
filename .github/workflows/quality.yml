name: Quality

on:
  pull_request:
  push:
    branches: [stage]

permissions:
  contents: read

jobs:
  m0-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: QA evidence integrity and helper regressions
        run: |
          python3 scripts/qa_evidence.py
          python3 -m unittest discover -s scripts -p 'test_qa_evidence.py'
          python3 -m unittest discover -s scripts -p 'test_career_review_harness.py'
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Build and install locked dependencies
        run: make init
      - name: Backend and frontend checks
        run: make lint
      - name: Start backend dependencies for tests
        run: docker compose up --detach --wait postgres redis
      - name: Backend and frontend tests
        run: make test
      - name: Frontend production build
        run: docker compose build frontend
