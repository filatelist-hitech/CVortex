name: cvortex

x-backend-environment: &backend-environment
  APP_NAME: ${APP_NAME}
  APP_ENV: ${APP_ENV}
  APP_KEY: ${APP_KEY}
  APP_DEBUG: ${APP_DEBUG}
  APP_URL: ${APP_URL}
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL}
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${POSTGRES_DB}
  DB_USERNAME: ${POSTGRES_USER}
  DB_PASSWORD: ${POSTGRES_PASSWORD}
  DB_CONNECT_TIMEOUT: 2
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: array
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_DB: ${REDIS_DB}
  REDIS_CACHE_DB: ${REDIS_CACHE_DB}
  REDIS_MAX_RETRIES: 1
  REDIS_READ_TIMEOUT: 2
  FILESYSTEM_DISK: local
  HORIZON_PREFIX: "cvortex_m0_horizon:"

services:
  nginx:
    image: nginx:1.31.5-alpine3.24
    ports:
      - "127.0.0.1:${CVORTEX_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/v1/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - edge

  frontend:
    build:
      context: ./apps/frontend
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0"]
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./apps/frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 24
    networks:
      - edge

  backend:
    build:
      context: ./apps/backend
    environment: *backend-environment
    volumes:
      - ./apps/backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - private_storage:/var/www/html/storage/app/private
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - edge
      - internal

  horizon:
    build:
      context: ./apps/backend
    command: ["php", "artisan", "horizon"]
    user: www-data
    environment: *backend-environment
    volumes:
      - ./apps/backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - private_storage:/var/www/html/storage/app/private
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - internal

  redis:
    image: redis:8.8.2-alpine3.23
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - internal

networks:
  edge:
  internal:
    internal: true

volumes:
  backend_vendor:
  frontend_node_modules:
  frontend_next:
  postgres_data:
  private_storage:
