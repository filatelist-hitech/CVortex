{
  "openapi": "3.1.0",
  "info": {
    "title": "CVortex ChatGPT plan and vacancy chat API",
    "version": "1.0.0",
    "description": "Owner-bound first-party Sanctum/CSRF resources. Ten requests/minute per user and endpoint. Separate from API-key billing and MCP authentication. OAuth/provider preview verified 2026-10-04."
  },
  "servers": [
    {
      "url": "/api/v1"
    }
  ],
  "security": [
    {
      "sessionCookie": []
    }
  ],
  "paths": {
    "/chatgpt/connections": {
      "get": {
        "summary": "List own connections and feature enabled flag",
        "responses": {
          "200": {
            "description": "Owned resource / result. Secrets are never included."
          },
          "401": {
            "description": "Unauthenticated"
          },
          "404": {
            "description": "Missing or foreign resource; non-enumerating"
          },
          "422": {
            "description": "Schema/source/evidence invalid"
          },
          "429": {
            "description": "Application/provider usage limit"
          },
          "503": {
            "description": "Provider unavailable"
          }
        }
      },
      "post": {
        "summary": "Begin owner-bound OAuth PKCE; returns authorization_url",
        "responses": {
          "200": {
            "description": "Owned resource / result. Secrets are never included."
          },
          "401": {
            "description": "Unauthenticated"
          },
          "404": {
            "description": "Missing or foreign resource; non-enumerating"
          },
          "422": {
            "description": "Schema/source/evidence invalid"
          },
          "429": {
            "description": "Application/provider usage limit"
          },
          "503": {
            "description": "Provider unavailable"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [],
                "properties": {
                  "connection_id": {
                    "type": "string",
                    "pattern": "^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$",
                    "minLength": 26,
                    "maxLength": 26
                  },
                  "consent": {
                    "type": "boolean",
                    "description": "Explicitly request renewed plan consent on reconnect."
                  }
                }
              }
            }
          }
        }
      }
    },
    "/chatgpt/connections/{id}/models": {
      "get": {
        "summary": "Discover current account model slugs and display names",
        "responses": {
          "200": {
            "description": "Owned resource / result. Secrets are never included."
          },
          "401": {
            "description": "Unauthenticated"
          },
          "404": {
            "description": "Missing or foreign resource; non-enumerating"
          },
          "422": {
            "description": "Schema/source/evidence invalid"
          },
          "429": {
            "description": "Application/provider usage limit"
          },
          "503": {
            "description": "Provider unavailable"
          }
        },
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$",
              "minLength": 26,
              "maxLength": 26
            }
          }
        ]
      }
    },
    "/chatgpt/connections/{id}/welcome": {
      "patch": {
        "summary": "Acknowledge first-use plan notice",
        "responses": {
          "200": {
            "description": "Owned resource / result. Secrets are never included."
          },
          "401": {
            "description": "Unauthenticated"
          },
          "404": {
            "description": "Missing or foreign resource; non-enumerating"
          },
          "422": {
            "description": "Schema/source/evidence invalid"
          },
          "429": {
            "description": "Application/provider usage limit"
          },
          "503": {
            "description": "Provider unavailable"
          }
        },
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$",
              "minLength": 26,
              "maxLength": 26
            }
          }
        ]
      }
    },
    "/chatgpt/connections/{id}": {
      "delete": {
        "summary": "Clear local secrets; attempt remote revocation; report remote_revocation_confirmed=false",
        "responses": {
          "200": {
            "description": "Owned resource / result. Secrets are never included."
          },
          "401": {
            "description": "Unauthenticated"
          },
          "404": {
            "description": "Missing or foreign resource; non-enumerating"
          },
          "422": {
            "description": "Schema/source/evidence invalid"
          },
          "429": {
            "description": "Application/provider usage limit"
          },
          "503": {
            "description": "Provider unavailable"
          }
        },
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$",
              "minLength": 26,
              "maxLength": 26
            }
          }
        ]
      }
    },
    "/chatgpt/connections/{id}/proof": {
      "post": {
        "summary": "Greeting-only plan verification",
        "responses": {
          "200": {
            "description": "SSE frames: started, delta, completed or error. A catalog change before inference emits MODEL_NOT_AVAILABLE. Completed emitted only after successful provider terminal event and local persistence. HTTP 200 alone is not success.",
            "content": {
              "text/event-stream": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "401": {
            "description": "Unauthenticated"
          },
          "404": {
            "description": "Missing or foreign resource; non-enumerating"
          },
          "422": {
            "description": "Invalid input or selected model rejection",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ModelSelectionError"
                }
              }
            }
          },
          "429": {
            "description": "Application/provider usage limit"
          },
          "503": {
            "description": "Provider unavailable"
          }
        },
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$",
              "minLength": 26,
              "maxLength": 26
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "model"
                ],
                "properties": {
                  "model": {
                    "type": "string",
                    "maxLength": 128
                  }
                }
              }
            }
          }
        }
      }
    },
    "/vacancies/{id}/chat": {
      "get": {
        "summary": "Open/retrieve own vacancy thread and latest 100 persisted messages",
        "responses": {
          "200": {
            "description": "Owned resource / result. Secrets are never included."
          },
          "401": {
            "description": "Unauthenticated"
          },
          "404": {
            "description": "Missing or foreign resource; non-enumerating"
          },
          "422": {
            "description": "Schema/source/evidence invalid"
          },
          "429": {
            "description": "Application/provider usage limit"
          },
          "503": {
            "description": "Provider unavailable"
          }
        },
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$",
              "minLength": 26,
              "maxLength": 26
            }
          }
        ]
      }
    },
    "/vacancies/{id}/chat/messages": {
      "post": {
        "summary": "Stream an owned turn using selected plan connection/model",
        "responses": {
          "200": {
            "description": "SSE frames: started, delta, completed or error. A catalog change before inference emits MODEL_NOT_AVAILABLE. Completed emitted only after successful provider terminal event and local persistence. HTTP 200 alone is not success.",
            "content": {
              "text/event-stream": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "401": {
            "description": "Unauthenticated"
          },
          "404": {
            "description": "Missing or foreign resource; non-enumerating"
          },
          "422": {
            "description": "Invalid input or selected model rejection",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ModelSelectionError"
                }
              }
            }
          },
          "429": {
            "description": "Application/provider usage limit"
          },
          "503": {
            "description": "Provider unavailable"
          }
        },
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$",
              "minLength": 26,
              "maxLength": 26
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "connection_id",
                  "model",
                  "client_request_id"
                ],
                "properties": {
                  "connection_id": {
                    "type": "string",
                    "pattern": "^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$",
                    "minLength": 26,
                    "maxLength": 26
                  },
                  "model": {
                    "type": "string",
                    "maxLength": 128
                  },
                  "client_request_id": {
                    "type": "string",
                    "maxLength": 128,
                    "pattern": "^[A-Za-z0-9_-]+$"
                  },
                  "content": {
                    "type": [
                      "string",
                      "null"
                    ],
                    "maxLength": 4000
                  },
                  "analyze": {
                    "type": "boolean"
                  }
                }
              }
            }
          }
        }
      }
    },
    "/vacancies/{id}/analysis-drafts": {
      "get": {
        "summary": "List latest 20 owned drafts",
        "responses": {
          "200": {
            "description": "Owned resource / result. Secrets are never included."
          },
          "401": {
            "description": "Unauthenticated"
          },
          "404": {
            "description": "Missing or foreign resource; non-enumerating"
          },
          "422": {
            "description": "Schema/source/evidence invalid"
          },
          "429": {
            "description": "Application/provider usage limit"
          },
          "503": {
            "description": "Provider unavailable"
          }
        },
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$",
              "minLength": 26,
              "maxLength": 26
            }
          }
        ]
      },
      "post": {
        "summary": "Save completed assistant message as source/evidence-fenced DRAFT",
        "responses": {
          "200": {
            "description": "Owned resource / result. Secrets are never included."
          },
          "401": {
            "description": "Unauthenticated"
          },
          "404": {
            "description": "Missing or foreign resource; non-enumerating"
          },
          "422": {
            "description": "Schema/source/evidence invalid"
          },
          "429": {
            "description": "Application/provider usage limit"
          },
          "503": {
            "description": "Provider unavailable"
          }
        },
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$",
              "minLength": 26,
              "maxLength": 26
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "message_id",
                  "client_request_id"
                ],
                "properties": {
                  "message_id": {
                    "type": "string",
                    "pattern": "^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$",
                    "minLength": 26,
                    "maxLength": 26
                  },
                  "client_request_id": {
                    "type": "string",
                    "maxLength": 128,
                    "pattern": "^[A-Za-z0-9_-]+$"
                  }
                }
              }
            }
          }
        }
      }
    },
    "/vacancy-analysis-drafts/{id}/approve": {
      "post": {
        "summary": "Explicit human promotion; recompute deterministic matching; never replace conflicting canonical requirements",
        "responses": {
          "200": {
            "description": "Owned resource / result. Secrets are never included."
          },
          "401": {
            "description": "Unauthenticated"
          },
          "404": {
            "description": "Missing or foreign resource; non-enumerating"
          },
          "422": {
            "description": "Schema/source/evidence invalid"
          },
          "429": {
            "description": "Application/provider usage limit"
          },
          "503": {
            "description": "Provider unavailable"
          }
        },
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$",
              "minLength": 26,
              "maxLength": 26
            }
          }
        ]
      }
    },
    "/chatgpt/callback": {
      "get": {
        "summary": "Loopback OAuth callback on 127.0.0.1; pending encrypted state identifies owner",
        "security": [],
        "parameters": [
          {
            "name": "state",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "code",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "client_id",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "error",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Safe return-to-CVortex page"
          },
          "400": {
            "description": "Expired/state/nonce/identity/permission or exchange failure; no secrets returned"
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "sessionCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "cvortex_session",
        "description": "Mutations require X-XSRF-TOKEN; public callback uses pending state/PKCE/nonce."
      }
    },
    "schemas": {
      "ModelSelectionError": {
        "type": "object",
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "object",
            "required": [
              "code",
              "retryable"
            ],
            "properties": {
              "code": {
                "type": "string",
                "enum": [
                  "MODEL_NOT_AVAILABLE",
                  "MODEL_NOT_ALLOWED"
                ]
              },
              "retryable": {
                "const": false
              }
            }
          }
        }
      },
      "Analysis": {
        "$ref": "../../runtime-ai/skills/vacancy-plan-chat/v1/output.schema.json"
      },
      "Connection": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$",
            "minLength": 26,
            "maxLength": 26
          },
          "client_id": {
            "type": "string"
          },
          "status": {
            "type": "string",
            "enum": [
              "NOT_CONNECTED",
              "CONNECTED",
              "PLAN_PERMISSION_MISSING",
              "REAUTHENTICATION_REQUIRED"
            ]
          },
          "welcome_acknowledged_at": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "updated_at": {
            "type": "string",
            "format": "date-time"
          }
        },
        "description": "Public projection only. Access/refresh/ID tokens and subject never returned."
      },
      "McpDraftSaveInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "vacancy_id",
          "snapshot_id",
          "client_request_id",
          "analysis"
        ],
        "properties": {
          "vacancy_id": {
            "type": "string",
            "pattern": "^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$",
            "minLength": 26,
            "maxLength": 26
          },
          "snapshot_id": {
            "type": "string",
            "pattern": "^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$",
            "minLength": 26,
            "maxLength": 26
          },
          "client_request_id": {
            "type": "string",
            "maxLength": 128,
            "pattern": "^[A-Za-z0-9_-]+$"
          },
          "analysis": {
            "$ref": "#/components/schemas/Analysis"
          }
        },
        "description": "MCP JSON-RPC tool input, not an HTTP endpoint. Uses bearer MCP authentication; 64 KiB analysis limit. Same request ID/payload is idempotent; changed payload rejected."
      }
    }
  }
}
